org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Scan the pairing QR with the **unbundled** ML Kit barcode model: Play Services
# supplies it instead of it being packed into the APK. The saving shows up in a
# **release** artifact (R8 and no kernel blob); a debug APK is dominated by the
# 120 MB JIT kernel and dexes, so its size barely moves. The typed code on the
# same screen is the fallback on a device without Play Services. See
# docs/cloud-sync.md "Pairing from a paired device".
dev.steenbakker.mobile_scanner.useUnbundled=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
